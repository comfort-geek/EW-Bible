name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find gradlew
        run: |
          ls -R
          find . -name "gradlew" -type f

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          elif [ -f "./EW-Bible/gradlew" ]; then
            chmod +x EW-Bible/gradlew
            echo "GRADLEW_PATH=EW-Bible" >> $GITHUB_ENV
          else
            echo "gradlew not found - check repo structure"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          if [ -n "$GRADLEW_PATH" ]; then
            cd $GRADLEW_PATH && ./gradlew assembleDebug
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
